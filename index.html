<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Via — Travel Tickets</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1c2330; --muted: #667085;
    --border: #e3e6eb; --accent: #2f6fed; --accent-text: #fff;
    --danger: #d64545; --soon: #c27a00; --chip: #eef2fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e6e9ef; --muted: #98a2b3;
      --border: #2b323e; --accent: #5b8ef5; --accent-text: #0d1117;
      --danger: #ef6b6b; --soon: #f0b44c; --chip: #232b3a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
  h1 span { color: var(--muted); font-weight: 400; font-size: 15px; margin-left: 8px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; }
  button, .btn {
    font: inherit; border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 7px 12px; border-radius: 8px; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.link { border: none; background: none; padding: 4px 6px; color: var(--muted); }
  button.link:hover { color: var(--text); }
  button.danger:hover { color: var(--danger); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input, select, textarea {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; width: 100%;
  }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .filters input { flex: 1 1 200px; }
  .filters select { flex: 0 1 160px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px; display: grid; grid-template-columns: 44px 1fr auto; gap: 12px;
  }
  .icon { font-size: 26px; line-height: 44px; text-align: center; background: var(--chip); border-radius: 10px; height: 44px; }
  .route { font-weight: 600; font-size: 16px; }
  .meta { color: var(--muted); font-size: 13.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { background: var(--chip); border-radius: 6px; padding: 2px 8px; font-size: 12.5px; }
  .chip code { font-family: ui-monospace, Menlo, monospace; font-weight: 600; }
  .when { text-align: right; white-space: nowrap; }
  .countdown { font-weight: 600; }
  .countdown.soon { color: var(--soon); }
  .actions { margin-top: 6px; }
  .past .card { opacity: .6; }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; border: 1px dashed var(--border); border-radius: 12px; }
  .notes { white-space: pre-wrap; font-size: 13.5px; margin-top: 6px; }
  dialog {
    border: 1px solid var(--border); border-radius: 14px; background: var(--card); color: var(--text);
    padding: 0; width: min(620px, calc(100vw - 32px));
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  form { padding: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
    .card { grid-template-columns: 36px 1fr; }
    .icon { font-size: 20px; line-height: 36px; height: 36px; }
    .when { grid-column: 2; text-align: left; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Via <span>all your booked travel in one place</span></h1>
    <div class="toolbar">
      <button id="exportBtn" title="Download a backup of your trips">Export</button>
      <button id="importBtn" title="Restore trips from a backup file">Import</button>
      <input type="file" id="importFile" accept="application/json" hidden>
      <button class="primary" id="addBtn">+ Add ticket</button>
    </div>
  </header>

  <div class="filters">
    <input id="search" type="search" placeholder="Search city, carrier, confirmation code…">
    <select id="typeFilter"><option value="">All types</option></select>
  </div>

  <h2 id="upcomingHead">Upcoming</h2>
  <div id="upcoming"></div>

  <div class="past">
    <h2 id="pastHead">Past</h2>
    <div id="past"></div>
  </div>
</div>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h3 id="formTitle" style="margin:0 0 14px">Add ticket</h3>
    <div class="grid">
      <div><label for="f-type">Type</label><select id="f-type" name="type" required></select></div>
      <div><label for="f-carrier">Carrier / provider</label><input id="f-carrier" name="carrier" placeholder="e.g. Delta, Amtrak, FlixBus"></div>
      <div><label for="f-from">From</label><input id="f-from" name="from" required placeholder="City or station"></div>
      <div><label for="f-to">To</label><input id="f-to" name="to" required placeholder="City or station"></div>
      <div><label for="f-depart">Departs</label><input id="f-depart" name="depart" type="datetime-local" required></div>
      <div><label for="f-arrive">Arrives</label><input id="f-arrive" name="arrive" type="datetime-local"></div>
      <div><label for="f-number">Flight / train / route no.</label><input id="f-number" name="number" placeholder="e.g. DL 1234"></div>
      <div><label for="f-confirmation">Confirmation code</label><input id="f-confirmation" name="confirmation" placeholder="e.g. X7KQ2P"></div>
      <div><label for="f-seat">Seat / class</label><input id="f-seat" name="seat" placeholder="e.g. 14C, Economy"></div>
      <div><label for="f-price">Price</label><input id="f-price" name="price" placeholder="e.g. $245.00"></div>
      <div class="full"><label for="f-link">Booking link</label><input id="f-link" name="link" type="url" placeholder="https://…"></div>
      <div class="full"><label for="f-notes">Notes</label><textarea id="f-notes" name="notes" rows="3" placeholder="Baggage, terminal, check-in reminders…"></textarea></div>
    </div>
    <div class="form-actions">
      <button type="button" id="cancelBtn">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<script>
const STORAGE_KEY = 'via.trips.v1';
const TYPES = {
  flight: { label: 'Flight', icon: '✈️' },
  train:  { label: 'Train',  icon: '🚆' },
  bus:    { label: 'Bus',    icon: '🚌' },
  ferry:  { label: 'Ferry',  icon: '⛴️' },
  cruise: { label: 'Cruise', icon: '🚢' },
  car:    { label: 'Car rental', icon: '🚗' },
  other:  { label: 'Other',  icon: '🎫' },
};
const FIELDS = ['type','carrier','from','to','depart','arrive','number','confirmation','seat','price','link','notes'];

const $ = (id) => document.getElementById(id);
let trips = load();
let editingId = null;

function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(trips)); }
  catch { alert('Could not save — your browser may be blocking local storage.'); }
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(v) {
  if (!v) return '';
  return new Date(v).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function countdown(v) {
  const d = new Date(v), now = new Date();
  const hours = (d - now) / 36e5;
  const midnight = x => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const days = Math.round((midnight(d) - midnight(now)) / 864e5); // calendar days
  if (hours < 1) return { text: 'within the hour', soon: true };
  if (days === 0) return { text: `in ${Math.round(hours)}h`, soon: true };
  if (days === 1) return { text: 'tomorrow', soon: true };
  return { text: `in ${days} days`, soon: days <= 7 };
}

function card(t, upcoming) {
  const type = TYPES[t.type] || TYPES.other;
  const cd = upcoming ? countdown(t.depart) : null;
  const chips = [
    t.confirmation && `<span class="chip">Conf <code>${esc(t.confirmation)}</code></span>`,
    t.number && `<span class="chip">${esc(t.number)}</span>`,
    t.seat && `<span class="chip">Seat ${esc(t.seat)}</span>`,
    t.price && `<span class="chip">${esc(t.price)}</span>`,
  ].filter(Boolean).join('');
  const safeLink = /^https?:\/\//i.test(t.link || '') ? t.link : '';
  return `<div class="card">
    <div class="icon" title="${type.label}">${type.icon}</div>
    <div>
      <div class="route">${esc(t.from)} → ${esc(t.to)}</div>
      <div class="meta">${type.label}${t.carrier ? ' · ' + esc(t.carrier) : ''}${t.arrive ? ' · arrives ' + esc(fmtDate(t.arrive)) : ''}</div>
      ${chips ? `<div class="chips">${chips}</div>` : ''}
      ${t.notes ? `<div class="notes">${esc(t.notes)}</div>` : ''}
      <div class="actions">
        ${safeLink ? `<a class="btn link" href="${esc(safeLink)}" target="_blank" rel="noopener">Booking ↗</a>` : ''}
        <button class="link" data-act="ics" data-id="${t.id}">Add to calendar</button>
        <button class="link" data-act="edit" data-id="${t.id}">Edit</button>
        <button class="link danger" data-act="delete" data-id="${t.id}">Delete</button>
      </div>
    </div>
    <div class="when">
      <div>${esc(fmtDate(t.depart))}</div>
      ${cd ? `<div class="countdown ${cd.soon ? 'soon' : ''}">${cd.text}</div>` : ''}
    </div>
  </div>`;
}

function render() {
  const q = $('search').value.trim().toLowerCase();
  const tf = $('typeFilter').value;
  const now = Date.now();
  const list = trips.filter(t =>
    (!tf || t.type === tf) &&
    (!q || FIELDS.some(f => String(t[f] ?? '').toLowerCase().includes(q))));
  // A trip stays "upcoming" until it arrives (or departs, if no arrival time).
  const isUpcoming = t => new Date(t.arrive || t.depart) >= now;
  const up = list.filter(isUpcoming).sort((a, b) => new Date(a.depart) - new Date(b.depart));
  const past = list.filter(t => !isUpcoming(t)).sort((a, b) => new Date(b.depart) - new Date(a.depart));

  $('upcomingHead').textContent = `Upcoming (${up.length})`;
  $('upcoming').innerHTML = up.length ? up.map(t => card(t, true)).join('')
    : `<div class="empty">${trips.length ? 'No upcoming trips match.' : 'No tickets yet. Click “+ Add ticket” to log your first booking.'}</div>`;
  $('pastHead').textContent = `Past (${past.length})`;
  $('pastHead').hidden = !past.length;
  $('past').innerHTML = past.map(t => card(t, false)).join('');
}

function openForm(trip) {
  editingId = trip?.id ?? null;
  $('formTitle').textContent = trip ? 'Edit ticket' : 'Add ticket';
  for (const f of FIELDS) $('f-' + f).value = trip?.[f] ?? (f === 'type' ? 'flight' : '');
  $('dlg').showModal();
  $('f-carrier').focus();
}

function icsDate(v) {
  // Floating local time, so the event shows at the time printed on the ticket.
  const d = new Date(v), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`;
}
function icsText(s) { return String(s ?? '').replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n'); }
function downloadICS(t) {
  const type = TYPES[t.type] || TYPES.other;
  const end = t.arrive || new Date(new Date(t.depart).getTime() + 36e5).toISOString();
  const desc = [t.carrier, t.number && `No. ${t.number}`, t.confirmation && `Confirmation: ${t.confirmation}`,
    t.seat && `Seat: ${t.seat}`, t.link, t.notes].filter(Boolean).join('\n');
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Via//Travel Tickets//EN','BEGIN:VEVENT',
    `UID:${t.id}@via`, `DTSTAMP:${icsDate(Date.now())}`,
    `DTSTART:${icsDate(t.depart)}`, `DTEND:${icsDate(end)}`,
    `SUMMARY:${icsText(`${type.label}: ${t.from} → ${t.to}`)}`,
    `LOCATION:${icsText(t.from)}`, `DESCRIPTION:${icsText(desc)}`,
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  download(`via-${t.from}-${t.to}.ics`.replace(/\s+/g, '_'), ics, 'text/calendar');
}
function download(name, content, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type: mime }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// --- wiring ---
for (const [k, v] of Object.entries(TYPES)) {
  $('f-type').add(new Option(`${v.icon} ${v.label}`, k));
  $('typeFilter').add(new Option(v.label, k));
}
$('addBtn').onclick = () => openForm(null);
$('cancelBtn').onclick = () => $('dlg').close();
$('search').oninput = render;
$('typeFilter').onchange = render;

$('form').onsubmit = (e) => {
  e.preventDefault();
  const data = Object.fromEntries(FIELDS.map(f => [f, $('f-' + f).value.trim()]));
  if (data.arrive && data.arrive < data.depart) { alert('Arrival must be after departure.'); return; }
  if (editingId) {
    trips = trips.map(t => t.id === editingId ? { ...t, ...data } : t);
  } else {
    trips.push({ id: crypto.randomUUID?.() ?? String(Date.now()), ...data });
  }
  save(); render(); $('dlg').close();
};

document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const trip = trips.find(t => t.id === btn.dataset.id);
  if (!trip) return;
  if (btn.dataset.act === 'edit') openForm(trip);
  if (btn.dataset.act === 'ics') downloadICS(trip);
  if (btn.dataset.act === 'delete' && confirm(`Delete ${trip.from} → ${trip.to}?`)) {
    trips = trips.filter(t => t.id !== trip.id); save(); render();
  }
});

$('exportBtn').onclick = () =>
  download(`via-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(trips, null, 2), 'application/json');
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const incoming = JSON.parse(await file.text());
    if (!Array.isArray(incoming)) throw new Error();
    const byId = new Map(trips.map(t => [t.id, t]));
    for (const t of incoming) if (t && t.id && t.depart) byId.set(t.id, t);
    trips = [...byId.values()];
    save(); render();
    alert(`Imported ${incoming.length} ticket(s).`);
  } catch { alert('That file is not a valid Via backup.'); }
  e.target.value = '';
};

render();
setInterval(render, 60_000); // keep countdowns fresh
</script>
</body>
</html>
